<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {

            height: 100vb;
            background-color: rgb(17, 16, 16);
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
        }

        .in_box {


            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;

        }

        .in_img {

            display: flex;
            background-color: rgb(48, 60, 101);
            border-radius: 10px;
            height: 50vb;
            width: 50vb;
            align-items: center;
            justify-content: center;
            box-shadow: 0px 0px 10px 10px rgb(83, 97, 168);
            border-style: solid;
            border-color: rgb(38, 0, 255);
            transition: 1s ease;



        }


        .in_form {
            font-size: 20px;

        }

        input[type="file"] {
            display: none;
        }

        .in_but {
            border: 1px solid #ccc;
            padding: 6px 12px;
            cursor: pointer;
            background-color: rgb(205, 236, 255);
            border-radius: 10px;
            transition: 1s ease;
            color: rgb(5, 95, 174);
            font-weight: 550;
        }

        .in_but:hover {
            background-color: rgb(3, 83, 255);
            color: rgb(184, 220, 252);
        }

        h1 {
            color: rgb(9, 134, 244);


        }

        .seperator {}
    </style>
</head>

<body>
    <h1 align="center">
        Upload the image of your handwritten digit and let our ML model say which digit it is
    </h1>
    <hr class="seperator">
    <div class="in_box">
        <div class="in_img">
            <form action="get" class="in_form">
                <label for="enter_image" class="in_but">Choose your handwritten digit image </label>
                <br>
                <input type="file" name="enter_image" id="enter_image">
            </form>
        </div>
    </div>
</body>

</html>
